name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.lock

      - name: Install locked runtime dependencies (wheels only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps --only-binary=:all: -r requirements.lock

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Byte-compile application modules
        run: python -m compileall -q bot main.py

      - name: Run Ruff lint checks
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.17.5"
          args: "check"
          src: "bot main.py"

      - name: Install static analysis and audit tools
        run: python -m pip install pyright==1.1.414 pip-audit==2.10.1

      - name: Run Pyright static type checks
        run: pyright

      - name: Audit locked runtime dependencies
        run: pip-audit --no-deps -r requirements.lock

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --no-cache -t backloggd-dc:ci .
