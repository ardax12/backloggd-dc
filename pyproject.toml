[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
    "tests",
    "tasks",
    "verify_all.py",
    "data",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = [
    "E501",  # Avoid noisy line-wrapping churn across SQL queries and Discord UI strings
]

[tool.ruff.lint.isort]
known-first-party = ["bot"]
